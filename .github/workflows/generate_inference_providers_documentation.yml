name: Generate Inference Providers Documentation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Every day at 3am

concurrency:
  group: generate_inference_providers_documentation
  cancel-in-progress: true

jobs:
  pull_request:
    runs-on: ubuntu-latest
    steps:
      # Setup
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610  # v3
        with:
          node-version: "20"
      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b  # v2
        with:
          run_install: |
            - recursive: true
              cwd: ./scripts/inference-providers
              args: [--frozen-lockfile]
          package_json_file: ./scripts/inference-providers/package.json
      - name: Update huggingface/tasks package
        working-directory: ./scripts/inference-providers
        run: |
          pnpm update @huggingface/tasks@latest @huggingface/inference@latest
      # Generate
      - name: Generate Inference Providers documentation
        run: pnpm run generate
        working-directory: ./scripts/inference-providers

      # Check changes
      - name: Check changes (including newly generated files)
        run: |
          git add -N -A
          git diff --name-only HEAD > changed_files.txt
          if grep -v -E "^(scripts/inference-providers/package.json|scripts/inference-providers/pnpm-lock.yaml)$" changed_files.txt | grep -q '.'; then
            echo "changes_detected=true" >> "$GITHUB_ENV"
          else
            echo "changes_detected=false" >> "$GITHUB_ENV"
          fi
          rm changed_files.txt

      # Skip PR if only certain files are updated
      - name: Skip PR creation if no meaningful changes
        if: env.changes_detected == 'false'
        run: echo "No meaningful changes. Skipping PR creation."

      # Keep automation read-only: produce a reviewable patch instead of using a
      # missing privileged bot token or merging generated changes automatically.
      - name: Prepare generated documentation patch
        if: env.changes_detected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -N -A
          git diff --binary HEAD > "$RUNNER_TEMP/inference-providers-docs.patch"
          test -s "$RUNNER_TEMP/inference-providers-docs.patch"

      - name: Upload generated documentation patch for review
        if: env.changes_detected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inference-providers-docs-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/inference-providers-docs.patch
          if-no-files-found: error
          retention-days: 14
